backend:
  name: github
  repo: moralesloaiza/elpoemario
  branch: main
  base_url: https://auth.elpoemario.com
  auth_endpoint: auth

publish_mode: editorial_workflow

media_folder: "src/assets/uploads"
public_folder: "/src/assets/uploads"

site_url: https://elpoemario.com
display_url: https://elpoemario.com
logo_url: https://elpoemario.com/logo.svg

locale: es

collections:
  - name: poemas
    label: "Poemas"
    label_singular: "Poema"
    folder: "src/content/poemas"
    media_folder: "../../assets/uploads"
    public_folder: "../../assets/uploads"
    create: true
    slug: "{{slug}}"
    identifier_field: titulo
    extension: md
    format: frontmatter
    fields:
      - { label: "Título", name: titulo, widget: string }
      - { label: "Resumen", name: resumen, widget: text, required: false }
      - { label: "Fecha", name: fecha, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: "Fecha actualizada", name: fecha_actualizada, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: false }
      - { label: "Ilustración", name: ilustracion, widget: image, required: false }
      - { label: "Enlace a Spotify", name: spotify_url, widget: string, required: false, pattern: ['^https://open\.spotify\.com/', 'Debe empezar con https://open.spotify.com/'] }
      - { label: "Borrador", name: borrador, widget: boolean, default: true }
      - label: "Tipo (forma métrica o estrófica)"
        name: tipo
        widget: select
        options:
          - soneto
          - silva
          - romance
          - decima
          - redondilla
          - cuarteta
          - cuarteto
          - terceto
          - quinteto
          - sexteto
          - octava-real
          - lira
          - oda
          - elegia
          - egloga
          - himno
          - balada
          - copla
          - seguidilla
          - letrilla
          - villancico
          - haiku
          - tanka
          - verso-libre
          - prosa-poetica
      - label: "Movimiento histórico-estético"
        name: movimiento
        widget: select
        required: false
        options:
          - medieval
          - siglo-de-oro
          - barroco
          - neoclasicismo
          - romanticismo
          - realismo
          - modernismo
          - generacion-98
          - vanguardia
          - generacion-27
          - posguerra
          - contemporaneo
          - popular-tradicional
      - label: "Temas (conceptos abstractos)"
        name: temas
        widget: select
        multiple: true
        min: 1
        options:
          - amor
          - desamor
          - muerte
          - tiempo
          - naturaleza
          - mar
          - noche
          - dios
          - soledad
          - memoria
          - infancia
          - patria
          - exilio
          - libertad
          - justicia
          - belleza
          - fe
          - duda
          - melancolia
          - alegria
          - esperanza
          - dolor
          - trabajo
          - amistad
          - sueno
          - vejez
          - juventud
          - ciudad
          - viaje
          - guerra
          - paz
          - arte
          - poesia-misma
          - silencio
          - identidad
          - deseo
          - ausencia
      - label: "Motivos (figuras concretas)"
        name: motivos
        widget: select
        multiple: true
        required: false
        default: []
        options:
          - amada
          - amado
          - yo-lirico
          - dios-figura
          - la-muerte-personificada
          - luna
          - sol
          - mar-figura
          - rio
          - montana
          - jardin
          - rosa
          - ruisenor
          - reloj
          - espejo
          - ventana
          - puerta
          - camino
          - barco
          - estrella
          - ceniza
          - lagrima
          - sangre
          - fuego
          - sombra
          - espada
          - libro
          - lira
          - sepulcro
          - ruinas
      - label: "Autor"
        name: autor
        widget: relation
        collection: autores
        value_field: "{{slug}}"
        search_fields: [nombre]
        display_fields: [nombre]
      - label: "Traductor"
        name: traductor
        widget: relation
        collection: autores
        value_field: "{{slug}}"
        search_fields: [nombre]
        display_fields: [nombre]
        required: false
        hint: "Solo para poemas traducidos. La ficha del traductor debe existir previamente en la colección Autores."
      - { label: "Curador", name: curador, widget: string, default: "Don Alejandro" }
      - { label: "Es seudónimo", name: es_seudonimo, widget: boolean, default: true }
      - { label: "Nombre real", name: nombre_real, widget: string, required: false }
      - { label: "Cuerpo del poema", name: body, widget: markdown }
      - { label: "Nota del curador", name: nota_curador, widget: markdown, required: false, hint: "Admite formato (párrafos, énfasis, listas, citas)." }

  - name: autores
    label: "Autores"
    label_singular: "Autor"
    folder: "src/content/autores"
    media_folder: "../../assets/uploads"
    public_folder: "../../assets/uploads"
    create: true
    slug: "{{slug}}"
    identifier_field: nombre
    extension: md
    format: frontmatter
    fields:
      - { label: "Nombre", name: nombre, widget: string }
      - label: "Tipo"
        name: tipo
        widget: select
        options: [clasico, colaborador]
        default: clasico
      - { label: "Descripción (para buscadores)", name: descripcion, widget: text, required: false, hint: "Resumen breve del autor para SEO (metadatos y JSON-LD). No se muestra en la ficha; la biografía visible va en el Cuerpo." }
      - { label: "Nacionalidad", name: nacionalidad, widget: string, required: false, hint: "Adjetivo gentilicio con género. Ej.: Venezolano, Cubana, Mexicano." }
      - { label: "Año de nacimiento", name: nacimiento, widget: number, value_type: int, min: 0, max: 2100, required: false }
      - { label: "Año de muerte", name: muerte, widget: number, value_type: int, min: 0, max: 2100, required: false }
      - { label: "Lugar de nacimiento", name: lugar_nacimiento, widget: string, required: false }
      - { label: "Lugar de muerte", name: lugar_muerte, widget: string, required: false }
      - { label: "Imagen", name: imagen, widget: image, required: false }
      - label: "Enlaces externos (sameAs)"
        name: sameAs
        widget: list
        required: false
        field: { label: URL, name: url, widget: string }
      - { label: "También figura en (hostname)", name: tambien_en, widget: string, required: false, hint: "Ej.: elfabulario.com. El slug debe ser idéntico en ambos portales." }
      - { label: "Cuerpo (biografía extendida)", name: body, widget: markdown }

  - name: "entradas"
    label: "Entradas"
    label_singular: "Entrada"
    identifier_field: "titulo"
    folder: "src/content/entradas"
    media_folder: "../../assets/uploads"
    public_folder: "../../assets/uploads"
    create: true
    slug: "{{slug}}"
    preview_path: "entradas/{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{borrador | ternary('[BORRADOR] ', '')}}{{titulo}} — {{tipo}} ({{fecha | date('YYYY-MM-DD')}})"
    description: "Bitácora del blog (anuncios, hitos, notas) y correspondencia (cartas del público con réplica del curador)."
    view_filters:
      - { label: "Borradores", field: borrador, pattern: true }
      - { label: "Publicadas", field: borrador, pattern: false }
      - { label: "Bitácora", field: tipo, pattern: "bitacora" }
      - { label: "Correspondencia", field: tipo, pattern: "correspondencia" }
    view_groups:
      - { label: "Tipo", field: tipo }
      - { label: "Estado", field: borrador }
    fields:
      # --- Identidad ---
      - { name: "titulo", label: "Título", widget: "string" }
      - { name: "fecha", label: "Fecha de publicación", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { name: "fecha_actualizada", label: "Fecha de actualización", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: false }
      - { name: "resumen", label: "Resumen", widget: "text", required: false }
      - { name: "ilustracion", label: "Ilustración", widget: "image", required: false }
      - { name: "spotify_url", label: "Enlace a Spotify", widget: "string", required: false, pattern: ['^https://open\.spotify\.com/', 'Debe empezar con https://open.spotify.com/'] }
      - { name: "borrador", label: "Borrador", widget: "boolean", default: false }

      # --- Firma del curador ---
      - { name: "curador", label: "Curador (firma pública)", widget: "string", default: "Don Alejandro" }
      - { name: "es_seudonimo", label: "¿La firma es un seudónimo?", widget: "boolean", default: true }
      - { name: "nombre_real", label: "Nombre real (privado)", widget: "string", required: false }

      # --- Discriminador de formato ---
      - name: "tipo"
        label: "Tipo de entrada"
        widget: "select"
        required: true
        default: "bitacora"
        hint: "Bitácora = entrada editorial regular. Correspondencia = carta de un lector con réplica."
        options:
          - { label: "Bitácora", value: "bitacora" }
          - { label: "Correspondencia (carta)", value: "correspondencia" }

      # --- Campos exclusivos de correspondencia ---
      - { name: "remitente", label: "Remitente", widget: "string", required: false, hint: "Solo correspondencia. Nombre publicable del autor de la carta; usa 'Un lector' para cartas anónimas. Obligatorio si Tipo = Correspondencia." }
      - name: "poema_referido"
        label: "Poema referido"
        widget: "relation"
        collection: "poemas"
        value_field: "{{slug}}"
        search_fields: ["titulo"]
        display_fields: ["titulo"]
        required: false
        hint: "Solo correspondencia. Si la carta discute un poema concreto, selecciónalo."

      # --- Cuerpo ---
      - { name: "body", label: "Cuerpo", widget: "markdown", hint: "Para correspondencia: usa '## Carta' y '## Respuesta' como encabezados de las dos secciones." }

  - name: "destacado"
    label: "Destacado de la home"
    description: "Singleton: el elemento curado que aparece destacado en la home. Solo uno activo a la vez. Polimórfico (poema, entrada o autor)."
    files:
      - name: "actual"
        label: "Destacado actual"
        file: "src/content/destacado/actual.md"
        fields:
          - { name: "activo", label: "Activo", widget: "boolean", default: true, hint: "Desmarca para apagar el destacado sin borrar la referencia." }
          - { name: "cintillo", label: "Cintillo (texto sobre el título)", widget: "string", hint: "Texto editorial breve. Se renderiza en mayúsculas. Ejemplos: 'En portada', 'Poema del mes', 'El curador recomienda'." }
          - name: "tipo"
            label: "Tipo de destacado"
            widget: "select"
            required: true
            default: "poema"
            options:
              - { label: "Poema", value: "poema" }
              - { label: "Entrada", value: "entrada" }
              - { label: "Autor", value: "autor" }
          - name: "poema_referido"
            label: "Poema"
            widget: "relation"
            collection: "poemas"
            value_field: "{{slug}}"
            search_fields: ["titulo"]
            display_fields: ["titulo"]
            required: false
            hint: "Selecciona si Tipo = Poema. El poema debe tener ilustración."
          - name: "entrada_referida"
            label: "Entrada"
            widget: "relation"
            collection: "entradas"
            value_field: "{{slug}}"
            search_fields: ["titulo"]
            display_fields: ["titulo"]
            required: false
            hint: "Selecciona si Tipo = Entrada. La entrada debe tener ilustración."
          - name: "autor_referido"
            label: "Autor"
            widget: "relation"
            collection: "autores"
            value_field: "{{slug}}"
            search_fields: ["nombre"]
            display_fields: ["nombre"]
            required: false
            hint: "Selecciona si Tipo = Autor. El autor debe tener retrato."