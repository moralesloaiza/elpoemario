backend:
  name: github
  repo: moralesloaiza/elpoemario
  branch: main
  base_url: https://auth.elpoemario.com
  auth_endpoint: auth

publish_mode: editorial_workflow

media_folder: "src/assets/uploads"
public_folder: "/src/assets/uploads"

site_url: https://elpoemario.com
display_url: https://elpoemario.com
logo_url: https://elpoemario.com/logo.svg

locale: es

collections:
  - name: poemas
    label: "Poemas"
    label_singular: "Poema"
    folder: "src/content/poemas"
    media_folder: "../../assets/uploads"
    public_folder: "../../assets/uploads"
    create: true
    slug: "{{slug}}"
    identifier_field: titulo
    extension: md
    format: frontmatter
    fields:
      - { label: "Título", name: titulo, widget: string }
      - { label: "Resumen", name: resumen, widget: text, required: false }
      - { label: "Fecha", name: fecha, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: "Fecha actualizada", name: fecha_actualizada, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: false }
      - { label: "Ilustración", name: ilustracion, widget: image, required: false }
      - { label: "Enlace a Spotify", name: spotify_url, widget: string, required: false, pattern: ['^https://open\.spotify\.com/', 'Debe empezar con https://open.spotify.com/'] }
      - { label: "Borrador", name: borrador, widget: boolean, default: true }
      - label: "Tipo (forma métrica o estrófica)"
        name: tipo
        widget: select
        options:
          - soneto
          - silva
          - madrigal
          - romance
          - romance-heroico
          - romancillo
          - endecha
          - decima
          - redondilla
          - cuarteta
          - cuarteto
          - serventesio
          - quintilla
          - terceto
          - pareado
          - quinteto
          - sexteto
          - octava-real
          - lira
          - oda
          - elegia
          - egloga
          - himno
          - balada
          - glosa
          - copla
          - seguidilla
          - letrilla
          - villancico
          - haiku
          - tanka
          - polimetrico
          - verso-libre
          - prosa-poetica
      - label: "Movimiento histórico-estético"
        name: movimiento
        widget: select
        required: false
        options:
          - medieval
          - siglo-de-oro
          - barroco
          - neoclasicismo
          - romanticismo
          - realismo
          - modernismo
          - generacion-98
          - vanguardia
          - generacion-27
          - posguerra
          - contemporaneo
          - popular-tradicional
      - label: "Temas (conceptos abstractos)"
        name: temas
        widget: select
        multiple: true
        min: 1
        options:
          - amor
          - desamor
          - muerte
          - tiempo
          - naturaleza
          - mar
          - noche
          - dios
          - soledad
          - memoria
          - infancia
          - patria
          - exilio
          - libertad
          - justicia
          - belleza
          - fe
          - duda
          - melancolia
          - alegria
          - esperanza
          - dolor
          - trabajo
          - amistad
          - sueno
          - vejez
          - juventud
          - ciudad
          - viaje
          - guerra
          - paz
          - arte
          - poesia-misma
          - silencio
          - identidad
          - deseo
          - ausencia
      - label: "Motivos (figuras concretas)"
        name: motivos
        widget: select
        multiple: true
        required: false
        default: []
        options:
          - amada
          - amado
          - yo-lirico
          - dios-figura
          - la-muerte-personificada
          - luna
          - sol
          - mar-figura
          - rio
          - montana
          - jardin
          - rosa
          - ruisenor
          - reloj
          - espejo
          - ventana
          - puerta
          - camino
          - barco
          - estrella
          - ceniza
          - lagrima
          - sangre
          - fuego
          - sombra
          - espada
          - libro
          - lira
          - sepulcro
          - ruinas
      - label: "Autor"
        name: autor
        widget: relation
        collection: autores
        value_field: "{{slug}}"
        search_fields: [nombre]
        display_fields: [nombre]
      - label: "Traductor"
        name: traductor
        widget: relation
        collection: autores
        value_field: "{{slug}}"
        search_fields: [nombre]
        display_fields: [nombre]
        required: false
        hint: "Solo para poemas traducidos. La ficha del traductor debe existir previamente en la colección Autores."
      - { label: "Curador", name: curador, widget: string, default: "Don Alejandro" }
      - { label: "Es seudónimo", name: es_seudonimo, widget: boolean, default: true }
      - { label: "Nombre real", name: nombre_real, widget: string, required: false }
      - { label: "Cuerpo del poema", name: body, widget: markdown }
      - { label: "Nota del curador", name: nota_curador, widget: markdown, required: false, hint: "Admite formato (párrafos, énfasis, listas, citas)." }

  - name: formas
    label: "Formas"
    label_singular: "Forma"
    description: "Ficha didáctica de una forma métrica: prosa explicativa + un verso de ejemplo en dominio público. Alimenta el bloque introductorio de /tipos/<forma>/. No todas las formas necesitan ficha."
    folder: "src/content/formas"
    create: true
    slug: "{{fields.forma}}"
    identifier_field: forma
    extension: md
    format: frontmatter
    fields:
      - label: "Forma (determina en qué página aparece)"
        name: forma
        widget: select
        hint: "El archivo se guarda con este nombre y la ficha aparece en /tipos/<forma>/. Debe coincidir con una forma existente."
        options:
          - soneto
          - silva
          - madrigal
          - romance
          - romance-heroico
          - romancillo
          - endecha
          - decima
          - redondilla
          - cuarteta
          - cuarteto
          - serventesio
          - quintilla
          - terceto
          - pareado
          - quinteto
          - sexteto
          - octava-real
          - lira
          - oda
          - elegia
          - egloga
          - himno
          - balada
          - glosa
          - copla
          - seguidilla
          - letrilla
          - villancico
          - haiku
          - tanka
          - polimetrico
          - verso-libre
          - prosa-poetica
      - { label: "Descripción", name: descripcion, widget: text, hint: "Prosa breve que explica en qué consiste la forma. Admite *cursiva* para títulos de obra (p. ej. *Cantos de vida y esperanza*)." }
      - { label: "Autor del ejemplo", name: ejemplo_autor, widget: string, hint: "Regla editorial: el verso debe ser de un autor en dominio público. Reproduce el texto tal cual." }
      - { label: "Obra del ejemplo", name: ejemplo_obra, widget: string, required: false, hint: "Opcional. Título de la obra o del poema del que procede el ejemplo." }
      - label: "Métrica"
        name: metrica
        widget: object
        required: false
        hint: "Opcional. Déjalo vacío en formas sin metro fijo (verso libre, prosa poética)."
        fields:
          - { label: "Medida", name: medida, widget: string, required: false, hint: "P. ej.: Endecasílabos, Octosílabos." }
          - { label: "Rima", name: rima, widget: string, required: false, hint: "P. ej.: Consonante ABBA ABBA CDE DCE." }
      - { label: "Verso de ejemplo", name: body, widget: markdown, hint: "El verso de dominio público. Un salto de línea = un verso; una línea en blanco = nueva estrofa." }

  - name: autores
    label: "Autores"
    label_singular: "Autor"
    folder: "src/content/autores"
    media_folder: "../../assets/uploads"
    public_folder: "../../assets/uploads"
    create: true
    slug: "{{slug}}"
    identifier_field: nombre
    extension: md
    format: frontmatter
    fields:
      - { label: "Nombre", name: nombre, widget: string }
      - label: "Tipo"
        name: tipo
        widget: select
        options: [director, clasico, colaborador]
        default: clasico
      - { label: "Descripción (para buscadores)", name: descripcion, widget: text, required: false, hint: "Resumen breve del autor para SEO (metadatos y JSON-LD). No se muestra en la ficha; la biografía visible va en el Cuerpo." }
      - label: "Nacionalidad"
        name: nacionalidad
        widget: select
        required: false
        options: [España, Venezuela, Colombia, México, Cuba, Argentina, Uruguay, Perú, Chile, Siria, Puerto Rico, Nicaragua]
        hint: "País del autor. La sección donde aparece (el gentilicio plural) se deriva automáticamente."
      - label: "Lengua original"
        name: lengua_original
        widget: select
        required: false
        options: [catalán, árabe]
        hint: "Solo si el autor escribió en una lengua distinta del castellano. Lo agrupa en «Poetas en otras lenguas»."
      - { label: "Año de nacimiento", name: nacimiento, widget: number, value_type: int, min: 0, max: 2100, required: false }
      - { label: "Año de muerte", name: muerte, widget: number, value_type: int, min: 0, max: 2100, required: false }
      - { label: "Lugar de nacimiento", name: lugar_nacimiento, widget: string, required: false }
      - { label: "Lugar de muerte", name: lugar_muerte, widget: string, required: false }
      - { label: "Imagen", name: imagen, widget: image, required: false }
      - label: "Enlaces externos (sameAs)"
        name: sameAs
        widget: list
        required: false
        field: { label: URL, name: url, widget: string }
      - { label: "También figura en (hostname)", name: tambien_en, widget: string, required: false, hint: "Ej.: elfabulario.com. El slug debe ser idéntico en ambos portales." }
      - { label: "Usuario de GitHub", name: github_username, widget: string, required: false, hint: "Solo colaboradores. Tu handle de GitHub (sin @). Habilita el control de propiedad en los PR." }
      - { label: "Nombre real (privado)", name: nombre_real, widget: string, required: false, hint: "Solo colaboradores que firman con seudónimo. Identidad legal; no se muestra en la ficha." }
      - { label: "Cuerpo (biografía extendida)", name: body, widget: markdown }

  - name: "entradas"
    label: "Entradas"
    label_singular: "Entrada"
    identifier_field: "titulo"
    folder: "src/content/entradas"
    media_folder: "../../assets/uploads"
    public_folder: "../../assets/uploads"
    create: true
    slug: "{{slug}}"
    preview_path: "entradas/{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{borrador | ternary('[BORRADOR] ', '')}}{{titulo}} — {{tipo}} ({{fecha | date('YYYY-MM-DD')}})"
    description: "Bitácora del blog (anuncios, hitos, notas) y correspondencia (cartas del público con réplica del curador)."
    view_filters:
      - { label: "Borradores", field: borrador, pattern: true }
      - { label: "Publicadas", field: borrador, pattern: false }
      - { label: "Bitácora", field: tipo, pattern: "bitacora" }
      - { label: "Correspondencia", field: tipo, pattern: "correspondencia" }
    view_groups:
      - { label: "Tipo", field: tipo }
      - { label: "Estado", field: borrador }
    fields:
      # --- Identidad ---
      - { name: "titulo", label: "Título", widget: "string" }
      - { name: "fecha", label: "Fecha de publicación", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { name: "fecha_actualizada", label: "Fecha de actualización", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: false }
      - { name: "resumen", label: "Resumen", widget: "text", required: false }
      - { name: "ilustracion", label: "Ilustración", widget: "image", required: false }
      - { name: "spotify_url", label: "Enlace a Spotify", widget: "string", required: false, pattern: ['^https://open\.spotify\.com/', 'Debe empezar con https://open.spotify.com/'] }
      - { name: "borrador", label: "Borrador", widget: "boolean", default: false }

      # --- Firma del curador ---
      - { name: "curador", label: "Curador (firma pública)", widget: "string", default: "Don Alejandro" }
      - { name: "es_seudonimo", label: "¿La firma es un seudónimo?", widget: "boolean", default: true }
      - { name: "nombre_real", label: "Nombre real (privado)", widget: "string", required: false }

      # --- Discriminador de formato ---
      - name: "tipo"
        label: "Tipo de entrada"
        widget: "select"
        required: true
        default: "bitacora"
        hint: "Bitácora = entrada editorial regular. Correspondencia = carta de un lector con réplica."
        options:
          - { label: "Bitácora", value: "bitacora" }
          - { label: "Correspondencia (carta)", value: "correspondencia" }

      # --- Campos exclusivos de correspondencia ---
      - { name: "remitente", label: "Remitente", widget: "string", required: false, hint: "Solo correspondencia. Nombre publicable del autor de la carta; usa 'Un lector' para cartas anónimas. Obligatorio si Tipo = Correspondencia." }
      - name: "poema_referido"
        label: "Poema referido"
        widget: "relation"
        collection: "poemas"
        value_field: "{{slug}}"
        search_fields: ["titulo"]
        display_fields: ["titulo"]
        required: false
        hint: "Solo correspondencia. Si la carta discute un poema concreto, selecciónalo."

      # --- Cuerpo ---
      - { name: "body", label: "Cuerpo", widget: "markdown", hint: "Para correspondencia: usa '## Carta' y '## Respuesta' como encabezados de las dos secciones." }

  - name: "destacado"
    label: "Destacado de la home"
    description: "Singleton: el elemento curado que aparece destacado en la home. Solo uno activo a la vez. Polimórfico (poema, entrada o autor)."
    files:
      - name: "actual"
        label: "Destacado actual"
        file: "src/content/destacado/actual.md"
        fields:
          - { name: "activo", label: "Activo", widget: "boolean", default: true, hint: "Desmarca para apagar el destacado sin borrar la referencia." }
          - { name: "cintillo", label: "Cintillo (texto sobre el título)", widget: "string", hint: "Texto editorial breve. Se renderiza en mayúsculas. Ejemplos: 'En portada', 'Poema del mes', 'El curador recomienda'." }
          - { name: "extracto", label: "Extracto de versos (solo para Tipo = Poema)", widget: "text", required: false, hint: "Versos elegidos a mano para la home; un verso por línea. Solo se muestra cuando Tipo = Poema. Entrada y Autor usan su propio resumen/descripción." }
          - name: "tipo"
            label: "Tipo de destacado"
            widget: "select"
            required: true
            default: "poema"
            options:
              - { label: "Poema", value: "poema" }
              - { label: "Entrada", value: "entrada" }
              - { label: "Autor", value: "autor" }
          - name: "poema_referido"
            label: "Poema"
            widget: "relation"
            collection: "poemas"
            value_field: "{{slug}}"
            search_fields: ["titulo"]
            display_fields: ["titulo"]
            required: false
            hint: "Selecciona si Tipo = Poema."
          - name: "entrada_referida"
            label: "Entrada"
            widget: "relation"
            collection: "entradas"
            value_field: "{{slug}}"
            search_fields: ["titulo"]
            display_fields: ["titulo"]
            required: false
            hint: "Selecciona si Tipo = Entrada."
          - name: "autor_referido"
            label: "Autor"
            widget: "relation"
            collection: "autores"
            value_field: "{{slug}}"
            search_fields: ["nombre"]
            display_fields: ["nombre"]
            required: false
            hint: "Selecciona si Tipo = Autor."

  - name: "paginas"
    label: "Páginas"
    description: "Textos fijos de las páginas del sitio: rótulos, títulos, subtítulos, meta-descripciones y, donde aplica, el cuerpo. Un archivo por página."
    files:
      - name: "home"
        label: "Inicio"
        file: "src/content/paginas/home.md"
        fields:
          - { name: "rotulo", label: "Antetítulo (hero)", widget: "string", required: false, hint: "Línea corta arriba del título de portada." }
          - { name: "titulo", label: "Lema (pestaña del navegador)", widget: "string", required: false, hint: "Aparece tras «El Poemario ·» en el título de la pestaña. No es el subtítulo visible." }
          - { name: "subtitulo", label: "Subtítulo visible (hero)", widget: "string", required: false }
          - { name: "lema", label: "Tagline en cursiva (bajo el título)", widget: "string", required: false, hint: "Frase en cursiva que aparece bajo «El Poemario» en la portada. Tono ambiental, no SEO." }
          - { name: "descripcion", label: "Meta descripción (SEO)", widget: "text", required: false }
          - { name: "podcast_titulo", label: "Pódcast: título de la sección", widget: "string", required: false }
          - { name: "podcast_subtitulo", label: "Pódcast: subtítulo de la sección", widget: "string", required: false }
          - { name: "podcast_eyebrow", label: "Pódcast: rótulo pequeño (ej. «Pódcast · Spotify»)", widget: "string", required: false }
          - { name: "podcast_cta", label: "Pódcast: texto del enlace", widget: "string", required: false }
          - { name: "podcast_glosa", label: "Pódcast: línea descriptiva", widget: "string", required: false }
      - name: "poemas"
        label: "Listado: Poemas"
        file: "src/content/paginas/poemas.md"
        fields:
          - { name: "rotulo", label: "Antetítulo", widget: "string", required: false }
          - { name: "titulo", label: "Título", widget: "string", required: false }
          - { name: "subtitulo", label: "Subtítulo", widget: "string", required: false }
          - { name: "descripcion", label: "Meta descripción (SEO)", widget: "text", required: false }
      - name: "autores"
        label: "Listado: Autores"
        file: "src/content/paginas/autores.md"
        fields:
          - { name: "rotulo", label: "Antetítulo", widget: "string", required: false }
          - { name: "titulo", label: "Título", widget: "string", required: false }
          - { name: "subtitulo", label: "Subtítulo", widget: "string", required: false }
          - { name: "descripcion", label: "Meta descripción (SEO)", widget: "text", required: false }
      - name: "bitacora"
        label: "Listado: Bitácora"
        file: "src/content/paginas/bitacora.md"
        fields:
          - { name: "rotulo", label: "Antetítulo", widget: "string", required: false }
          - { name: "titulo", label: "Título", widget: "string", required: false }
          - { name: "subtitulo", label: "Subtítulo", widget: "string", required: false }
          - { name: "descripcion", label: "Meta descripción (SEO)", widget: "text", required: false }
      - name: "temas"
        label: "Listado: Temas"
        file: "src/content/paginas/temas.md"
        fields:
          - { name: "rotulo", label: "Antetítulo", widget: "string", required: false }
          - { name: "titulo", label: "Título", widget: "string", required: false }
          - { name: "subtitulo", label: "Subtítulo", widget: "string", required: false }
          - { name: "descripcion", label: "Meta descripción (SEO)", widget: "text", required: false }
      - name: "tipos"
        label: "Listado: Formas"
        file: "src/content/paginas/tipos.md"
        fields:
          - { name: "rotulo", label: "Antetítulo", widget: "string", required: false }
          - { name: "titulo", label: "Título", widget: "string", required: false }
          - { name: "subtitulo", label: "Subtítulo", widget: "string", required: false }
          - { name: "descripcion", label: "Meta descripción (SEO)", widget: "text", required: false }
      - name: "nacionalidades"
        label: "Listado: Nacionalidades"
        file: "src/content/paginas/nacionalidades.md"
        fields:
          - { name: "rotulo", label: "Antetítulo", widget: "string", required: false }
          - { name: "titulo", label: "Título", widget: "string", required: false }
          - { name: "subtitulo", label: "Subtítulo", widget: "string", required: false }
          - { name: "descripcion", label: "Meta descripción (SEO)", widget: "text", required: false }
      - name: "otras-lenguas"
        label: "Listado: En otras lenguas"
        file: "src/content/paginas/otras-lenguas.md"
        fields:
          - { name: "rotulo", label: "Antetítulo", widget: "string", required: false }
          - { name: "titulo", label: "Título", widget: "string", required: false }
          - { name: "descripcion", label: "Meta descripción (SEO)", widget: "text", required: false }
      - name: "siglos"
        label: "Listado: Siglos"
        file: "src/content/paginas/siglos.md"
        fields:
          - { name: "rotulo", label: "Antetítulo", widget: "string", required: false }
          - { name: "titulo", label: "Título", widget: "string", required: false }
          - { name: "subtitulo", label: "Subtítulo", widget: "string", required: false }
          - { name: "descripcion", label: "Meta descripción (SEO)", widget: "text", required: false }
      - name: "cartas"
        label: "Listado: Cartas"
        file: "src/content/paginas/cartas.md"
        fields:
          - { name: "rotulo", label: "Antetítulo", widget: "string", required: false }
          - { name: "titulo", label: "Título", widget: "string", required: false }
          - { name: "subtitulo", label: "Subtítulo", widget: "string", required: false, hint: "El enlace a «correspondencia» que sigue al subtítulo está fijado en la plantilla; no se edita aquí." }
          - { name: "descripcion", label: "Meta descripción (SEO)", widget: "text", required: false }
      - name: "correspondencia"
        label: "Correspondencia"
        file: "src/content/paginas/correspondencia.md"
        fields:
          - { name: "rotulo", label: "Antetítulo", widget: "string", required: false }
          - { name: "titulo", label: "Título", widget: "string", required: false }
          - { name: "subtitulo", label: "Subtítulo", widget: "string", required: false }
          - { name: "descripcion", label: "Meta descripción (SEO)", widget: "text", required: false }
          - { name: "body", label: "Texto de introducción", widget: "markdown", required: false, hint: "Solo la introducción sobre el formulario. El formulario está fijado en la plantilla." }
      - name: "sobre"
        label: "Acerca de"
        file: "src/content/paginas/sobre.md"
        fields:
          - { name: "rotulo", label: "Antetítulo", widget: "string", required: false }
          - { name: "titulo", label: "Título (encabezado visible)", widget: "string", required: false }
          - { name: "subtitulo", label: "Subtítulo", widget: "string", required: false }
          - { name: "descripcion", label: "Meta descripción (SEO)", widget: "text", required: false }
          - { name: "body", label: "Contenido", widget: "markdown", required: false }
      - name: "colaborar"
        label: "Colaborar"
        file: "src/content/paginas/colaborar.md"
        fields:
          - { name: "rotulo", label: "Antetítulo", widget: "string", required: false }
          - { name: "titulo", label: "Título (encabezado visible)", widget: "string", required: false }
          - { name: "subtitulo", label: "Subtítulo", widget: "string", required: false }
          - { name: "descripcion", label: "Meta descripción (SEO)", widget: "text", required: false }
          - { name: "body", label: "Contenido", widget: "markdown", required: false, hint: "Los enlaces externos abren en pestaña nueva automáticamente." }
      - name: "buscar"
